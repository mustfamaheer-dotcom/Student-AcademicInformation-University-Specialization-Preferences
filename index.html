<!DOCTYPE html>

<head>

<body>

  <!-- Background Decorative Orbs -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <div class="app-container">

    <!-- Top Action Bar -->
    <div class="top-bar">

      </p>
    </header>

    <!-- Form Closed Message -->
    <div class="device-blocked-card" id="formClosedCard" style="display: flex; margin-bottom: 20px;">
      <div class="blocked-icon">
        <i class="fa-solid fa-lock" style="color: var(--danger-color);"></i>

        <a href="https://wa.me/201100638244" target="_blank" class="btn btn-accent" style="display: inline-flex; text-decoration: none; align-items: center; justify-content: center; padding: 15px 30px; font-size: 1.2rem; border-radius: var(--radius-md); gap: 10px; background: #25D366; color: white; border: none; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);">
